{% extends 'base.html' %}  
{% block content %}
<h1>Add Your Progress</h1>
    <form method="POST" enctype="multipart/form-data">        
        {{ form.csrf_token }}
        <p>Date {{ form.date() }}</p>
        <p>Title {{ form.title() }}</p>
        <p>Details {{ form.details() }}</p>
        <p>Image {{ form.image() }}</p>
        <p>{{ form.submit }}</p>
    </form>
{% endblock %}
