{% extends 'base.html' %}
{% block content %}
<h1>Enter Your Login Details</h1>
    <form method="POST" action="{{ url_for('login') }}">
        {{ form.csrf_token }}
        <p>Username {{ form.username() }}</p>
        <p>Password {{ form.password() }}</p>
        <p>{{ form.submit }}</p>
    </form>
{% endblock %}
